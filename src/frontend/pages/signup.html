<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="../styles/signup.css">
    <link rel="stylesheet" href="../styles/font.css">
    <link rel="stylesheet" href="../styles/modal.css">
    <link rel="stylesheet" href="../styles/background.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

</head>
<body>
    <!-- Sign Up Page Content Start Here -->
    <div class="bg-container"></div>
    <div class="bg-overlay"></div>

    <div class="container signup-shell">
        <header class="signup-header">
            <div>
                <p class="signup-kicker">ACCOUNT SETUP</p>
                <h1>Sign Up</h1>
            </div>
            <a class="welcome-link" href="../index.html">Back to Welcome</a>
        </header>

        <nav class="phase-tabs" aria-label="Signup phases">
            <a class="phase-tab is-active" href="signup.html" aria-current="step">
                <span>1</span> Profile details
            </a>
            <a class="phase-tab" href="funnel/signup2.html">
                <span>2</span> Login details
            </a>
        </nav>

        <form class="phase-one-form" action="">
            <div class="input-grid">

            <!-- Input Types -->
            <div class="input-box">
                <input type="text" id="user-name" placeholder="Name" required>
            </div>
            <div class="input-box">
                <input type="email" id="user-email" placeholder="example@gamail.com" required>
            </div>
            <div class="input-box">
                <input type="tel" id="user-phone" placeholder="ex.09091234567" required>
            </div>
            </div>

            <button type="submit" class="btn" id="next-btn">Next</button>
        </form>
    </div>

    <script src="../js/local-store.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
