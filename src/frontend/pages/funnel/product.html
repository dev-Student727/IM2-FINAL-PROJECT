<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../styles/main-system.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <title>MRB-POS | Products</title>
</head>
<body>
    <!-- Product Stracture-->
    <div class="product-wrapper">
        <aside class="sidebar">
            <a href="#" class="brand">
                <span class="brand-mark">M</span>
                <span class="brand-copy">
                    <strong>MRB-POS</strong>
                    <small>POS &amp; Inventory</small>
                </span>
            </a>

            <nav class="sidebar-nav" aria-label="Main menu">
                <!-- Dashboard -->
                <a href="../dashboard.html" class="nav-item">
                    <i class="bx bx-grid-alt" aria-hidden="true"></i>
                    <span>Dashboard</span>
                </a>

                <!-- Point-of-sales-->
                <a href="../funnel/pos.html" class="nav-item">
                    <i class="bx bx-cart" aria-hidden="true"></i>
                    <span>Point of Sales</span>
                </a>

                <!-- Products -->
                <a href="#product" class="nav-item active">
                    <i class="bx bx-package" aria-hidden="true"></i>
                    <span>Product</span>
                </a>

                <!-- Debts -->
                <a href="../funnel/debts.html" class="nav-item">
                    <i class="bx bx-credit-card" aria-hidden="true"></i>
                    <span>Debts</span>
                </a>

                <!-- New Sales -->
                <a href="sales.html" class="nav-item">
                    <i class="bx bx-bar-chart-alt-2" aria-hidden="true"></i>
                    <span>Sales</span>
                </a>

                <!-- History -->
                <a href="../history.html" class="nav-item">
                    <i class="bx bx-history" aria-hidden="true"></i>
                    <span>History</span>
                </a>

                <!-- Pos-Setting -->
                <a href="../settings.html" class="nav-item">
                    <i class="bx bx-cog" aria-hidden="true"></i>
                    <span>Settings</span>
                </a>
            </nav>
        </aside>

        <!-- Main Product Dashboard -->
        <div class="main-dashboard">
            <header class="top-navbar">
                <h1>Product</h1>
                <a class="new-sale-btn" href="pos.html">
                    <i class="bx bx-cart" aria-hidden="true"></i>
                    <span>New Sales</span>
                </a>
            </header>

            <!-- Product page layout is kept separate from the POS page layout. -->
            <main class="product-content">
                <section class="product-page-catalog" aria-label="products">
                    <div class="product-page-toolbar">
                        <input id="product-search" class="product-page-search" type="search" placeholder="Search by name or its SKU..">

                        <select id="category-filter" class="product-page-category" aria-label="Filter products by category">
                            <option value="all">All Categories</option>
                            <option value="dairy">Dairy</option>
                            <option value="noodles">Noodles</option>
                            <option value="snacks">Snacks</option>
                            <option value="beverages">Beverages</option>
                            <option value="households">Households</option>
                            <option value="others">Others</option>
                        </select>

                        <button class="add-product-button" id="open-add-product" type="button">
                            <i class="bx bx-plus" aria-hidden="true"></i>
                            Add new product
                        </button>
                    </div>

                    <!-- Product inventory rows are created when a product is saved. -->
                    <div class="product-table-wrap">
                        <table class="product-table">
                            <thead>
                                <tr>
                                    <th scope="col">Name</th>
                                    <th scope="col">Category</th>
                                    <th scope="col">SKU</th>
                                    <th scope="col">Price</th>
                                    <th scope="col">Stock</th>
                                    <th scope="col">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="product-table-body">
                                <tr id="no-products-row">
                                    <td colspan="6">No products.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>

                <!-- Add Product dialog; the form creates a row in the inventory table. -->
                <dialog class="add-product-dialog" id="add-product-dialog" aria-labelledby="add-product-title">
                    <form id="add-product-form">
                        <div class="add-product-heading">
                            <h2 id="add-product-title">Add product</h2>
                            <button class="add-product-close" id="close-add-product" type="button" aria-label="Close dialog">
                                <i class="bx bx-x" aria-hidden="true"></i>
                            </button>
                        </div>

                        <label class="add-product-field">
                            <span>Name</span>
                            <input id="new-product-name" name="name" type="text" required>
                        </label>

                        <div class="add-product-fields">
                            <label class="add-product-field">
                                <span>Category</span>
                                <select id="new-product-category" name="category" required>
                                    <option value="">Select category</option>
                                    <option value="Dairy">Dairy</option>
                                    <option value="Noodles">Noodles</option>
                                    <option value="Snacks">Snacks</option>
                                    <option value="Beverages">Beverages</option>
                                    <option value="Households">Households</option>
                                    <option value="Others">Others</option>
                                </select>
                            </label>
                            <label class="add-product-field">
                                <span>SKU</span>
                                <input id="new-product-sku" name="sku" type="text" required>
                            </label>
                            <label class="add-product-field">
                                <span>Price</span>
                                <input id="new-product-price" name="price" type="number" min="0.01" step="0.01" value="0" required>
                            </label>
                            <label class="add-product-field">
                                <span>Stock</span>
                                <input id="new-product-stock" name="stock" type="number" min="0" step="1" value="0" required>
                            </label>
                        </div>

                        <label class="add-product-field">
                            <span>Low stock threshold</span>
                            <input id="new-product-threshold" name="threshold" type="number" min="0" step="1" value="5" required>
                        </label>

                        <p class="add-product-error" id="add-product-error" role="alert" hidden></p>

                        <div class="add-product-actions">
                            <button class="add-product-cancel" id="cancel-add-product" type="button">Cancel</button>
                            <button class="add-product-save" type="submit">Save</button>
                        </div>
                    </form>
                </dialog>
            </main>
        </div>
    </div>

    <script src="../../js/main-system.js"></script>
</body>
</html>
